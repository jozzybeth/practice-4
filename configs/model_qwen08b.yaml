base_model_name: "Qwen/Qwen3.5-0.8B"
lora_dir: "models/qwen08b_lora_adapter"
merged_dir: "models/qwen08b_merged"

vllm_endpoint: "http://localhost:8000/v1"

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

training:
  num_epochs: 2
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  fp16: true
  bf16: false
  eval_steps: 100
  save_steps: 100
  logging_steps: 10

judge:
  model: "allam-2-7b"
  num_examples: 420
  seed: 2026
  daily_token_limit: 500000